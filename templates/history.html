{% extends "base.html" %}
{% block title %}History — CyberShield AI{% endblock %}
{% block page_title %}<i class="fas fa-clock-rotate-left me-2" style="color:var(--accent-primary)"></i>Analysis History{% endblock %}
{% block content %}
<div class="cyber-card">
  <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;">
    <div class="card-title mb-0"><i class="fas fa-list"></i>All Analyses</div>
    <div style="margin-left:auto;font-size:13px;color:var(--text-muted);">Total: <span id="histTotal">—</span></div>
  </div>
  <div style="overflow-x:auto;">
    <table class="cyber-table">
      <thead><tr><th>ID</th><th>Dataset</th><th>Model</th><th>Total</th><th>Suspicious</th><th>High Risk</th><th>Duration</th><th>Date</th><th>Actions</th></tr></thead>
      <tbody id="histTbody"><tr><td colspan="9" style="text-align:center;padding:30px;color:var(--text-muted)">Loading...</td></tr></tbody>
    </table>
  </div>
  <div id="histPagination" style="display:flex;gap:8px;margin-top:14px;justify-content:center;"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function loadHistory(page = 1) {
  const res = await fetch(`/api/analysis/history?page=${page}&per_page=10`);
  const data = await res.json();
  document.getElementById('histTotal').textContent = data.total;
  const tbody = document.getElementById('histTbody');
  if (!data.analyses.length) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:30px;color:var(--text-muted)">No analyses found. Upload a dataset and run detection first.</td></tr>';
    return;
  }
  tbody.innerHTML = data.analyses.map(a => `
    <tr>
      <td>#${a.id}</td>
      <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${a.dataset_name}</td>
      <td><code style="font-size:10px;">${a.model_version}</code></td>
      <td>${fmtNum(a.total_events)}</td>
      <td><span style="color:var(--danger)">${fmtNum(a.suspicious_events)}</span></td>
      <td><span style="color:var(--danger)">${fmtNum(a.high_risk_events)}</span></td>
      <td>${a.processing_time.toFixed(2)}s</td>
      <td style="font-size:11.5px;">${formatDate(a.started_at)}</td>
      <td>
        <a href="/api/reports/${a.id}/pdf" class="btn-ghost" style="padding:4px 10px;font-size:11px;display:inline-flex;align-items:center;gap:4px;"><i class="fas fa-file-pdf"></i>PDF</a>
        <a href="/api/reports/${a.id}/csv" class="btn-ghost" style="padding:4px 10px;font-size:11px;display:inline-flex;align-items:center;gap:4px;margin-left:4px;"><i class="fas fa-file-csv"></i>CSV</a>
      </td>
    </tr>`).join('');
  let pHtml = '';
  for (let i = 1; i <= data.pages; i++) {
    pHtml += `<button class="btn-ghost" style="padding:4px 10px;font-size:12px;${i===page?'border-color:var(--accent-primary);color:var(--accent-primary)':''}" onclick="loadHistory(${i})">${i}</button>`;
  }
  document.getElementById('histPagination').innerHTML = pHtml;
}
loadHistory();
</script>
{% endblock %}
